<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour ma chère Mlle Dong - Winter Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body, html { 
            margin: 0; padding: 0; overflow: hidden; 
            height: 100%;
            /* --- 改动 1: 冬日背景渐变 --- */
            background: radial-gradient(ellipse at bottom, #e0eafc 0%, #cfdef3 40%, #a8c0d8 100%);
        }
        #canvas-container { 
            width: 100%; height: 100%; display: block; 
            position: absolute; top: 0; left: 0; z-index: 1;
        }
        #text-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            pointer-events: none;
            z-index: 10;
            padding-bottom: 12vh;
        }
        .main-text {
            font-family: 'Parisienne', cursive;
            color: #fffaf0; /* 稍微带点暖的象牙白 */
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            text-align: center;
            /* 调整阴影，在明亮背景下增加一点深色对比，同时保留柔和粉光 */
            text-shadow: 
                0 2px 5px rgba(0,0,0,0.2),
                0 0 15px rgba(255, 192, 203, 0.5);
            opacity: 0;
            animation: fadeInText 3s ease-in-out forwards 1s;
        }
        .sub-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #e68a9e; /* 稍微深一点的粉色以适应亮背景 */
            margin-top: 5px;
            letter-spacing: 0.1em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            opacity: 0;
            animation: fadeInText 3s ease-in-out forwards 2.5s;
        }

        @keyframes fadeInText {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="text-overlay">
        <div class="main-text">Pour ma chère Mlle Dong</div>
        <div class="sub-text">Joyeux Noël</div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'https://esm.sh/three@0.160.0';
        import { EffectComposer } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, composer;
        let treeParticles, heartParticles;
        const clock = new THREE.Clock();

        let treeColorTime = 0;
        const colorChangeInterval = 5;
        let curColorBottom = new THREE.Color(0x005577);
        let curColorTop = new THREE.Color(0x55ff88);
        let targetColorBottom = new THREE.Color(0x005577);
        let targetColorTop = new THREE.Color(0x55ff88);
        const goldAccent = new THREE.Color(0xffd700);

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            // --- 改动 2: 匹配冬日背景的浅色雾气 ---
            scene.fog = new THREE.FogExp2(0xcfdef3, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 55);
            camera.lookAt(0, 18, 0);

            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true }); // alpha: true 允许背景透出来
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            // renderer.setClearColor(0x000000, 0); // 让 canvas 背景透明
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const renderScene = new RenderPass(scene, camera);
            
            // --- 改动 3: 柔和的光效参数 ---
            // Strength 从 2.5 降到 1.2 (更柔和)
            // Threshold 从 0.2 提到 0.4 (只有亮部发光)
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.2,  // Strength: 强度降低
                0.8,  // Radius: 半径稍大，光晕更散
                0.4   // Threshold: 阈值提高，不刺眼
            );
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createGradientTree();
            createHearts();

            window.addEventListener('resize', onWindowResize);
        }

        function createHeartTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            // --- 改动 4: 加深爱心颜色以适应亮背景 ---
            ctx.fillStyle = '#e91e63'; // 更深的玫瑰粉
            ctx.beginPath();
            const x = 32, y = 32;
            ctx.moveTo(x, y + 18);
            ctx.bezierCurveTo(x - 20, y + 6, x - 20, y - 14, x, y - 14);
            ctx.bezierCurveTo(x + 20, y - 14, x + 20, y + 6, x, y + 18);
            ctx.fill();
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }

        function createHearts() {
            const count = 1500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const userData = [];

            for (let i = 0; i < count; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 120;
                positions[i * 3 + 1] = Math.random() * 80 + 10;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 120;
                userData.push({
                    speed: Math.random() * 0.15 + 0.05,
                    drift: Math.random() * 0.03 + 0.01,
                    offset: Math.random() * Math.PI * 2
                });
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.userData.info = userData;

            const material = new THREE.PointsMaterial({
                map: createHeartTexture(),
                size: 1.5,
                // --- 改动 5: 材质颜色也稍微加深 ---
                color: 0xff80ab, 
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            heartParticles = new THREE.Points(geometry, material);
            scene.add(heartParticles);
        }

        function createGradientTree() {
            const particleCount = 20000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const heights = new Float32Array(particleCount);

            const treeHeight = 45;
            const maxRadius = 16;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const progress = i / particleCount;
                heights[i] = progress;

                const angle = progress * Math.PI * 60;
                const radius = maxRadius * (1 - progress) + (Math.random() - 0.5) * 2.5;
                const y = progress * treeHeight;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;

                positions[i3] = x; positions[i3 + 1] = y; positions[i3 + 2] = z;
                colors[i3] = 0; colors[i3+1] = 0; colors[i3+2] = 0; 
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('height', new THREE.BufferAttribute(heights, 1));

            const material = new THREE.PointsMaterial({
                size: 0.35,
                vertexColors: true,
                transparent: true,
                // --- 改动 6: 稍微提高一点不透明度以适应亮背景 ---
                opacity: 0.95,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            treeParticles = new THREE.Points(geometry, material);
            treeParticles.position.y = -8;
            scene.add(treeParticles);
        }

        function getRandomColor() {
            const hue = Math.random();
            const saturation = 0.8 + Math.random() * 0.2;
            const lightness = 0.5 + Math.random() * 0.3;
            return new THREE.Color().setHSL(hue, saturation, lightness);
        }

        function updateTreeColors(delta) {
            treeColorTime += delta;
            if (treeColorTime > colorChangeInterval) {
                treeColorTime = 0;
                targetColorBottom = getRandomColor();
                targetColorTop = getRandomColor();
            }

            curColorBottom.lerp(targetColorBottom, delta * 0.5);
            curColorTop.lerp(targetColorTop, delta * 0.5);

            const colors = treeParticles.geometry.attributes.color.array;
            const heights = treeParticles.geometry.attributes.height.array;

            for (let i = 0; i < heights.length; i++) {
                const i3 = i * 3;
                const progress = heights[i];
                let finalColor = curColorBottom.clone().lerp(curColorTop, progress);
                if (i % 30 === 0) finalColor = goldAccent;
                colors[i3] = finalColor.r;
                colors[i3 + 1] = finalColor.g;
                colors[i3 + 2] = finalColor.b;
            }
            treeParticles.geometry.attributes.color.needsUpdate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (treeParticles) {
                treeParticles.rotation.y += 0.0015;
                updateTreeColors(delta);
            }

            if (heartParticles) {
                const positions = heartParticles.geometry.attributes.position.array;
                const userData = heartParticles.geometry.userData.info;
                for (let i = 0; i < userData.length; i++) {
                    const i3 = i * 3;
                    const d = userData[i];
                    positions[i3 + 1] -= d.speed;
                    positions[i3] += Math.sin(time * 1.5 + d.offset) * d.drift;
                    positions[i3 + 2] += Math.cos(time * 1.5 + d.offset) * d.drift;

                    if (positions[i3 + 1] < -15) {
                        positions[i3 + 1] = Math.random() * 30 + 70;
                        positions[i3] = (Math.random() - 0.5) * 120;
                        positions[i3 + 2] = (Math.random() - 0.5) * 120;
                    }
                }
                heartParticles.geometry.attributes.position.needsUpdate = true;
            }
            composer.render();
        }
    </script>
</body>
</html>
